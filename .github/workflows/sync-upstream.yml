name: Sync upstream

# Keeps this fork up to date with tashfeenahmed/freellmapi.
# Every merged update lands on `main`, and Render's auto-deploy then rebuilds
# the service automatically — no manual intervention needed.
#
# Triggers:
#   - schedule: runs automatically at the times below (UTC)
#   - workflow_dispatch: run it manually from the Actions tab ("Run workflow")
#   - push to sync-upstream branch: re-run after editing this file
on:
  schedule:
    # Every day at 00:00 and 12:00 UTC
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force a sync even when already up to date (rerender commit)'
        required: false
        default: 'false'

# The job pushes to the repo, so it needs its own token with write access.
permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add upstream
        run: git remote add upstream https://github.com/tashfeenahmed/freellmapi.git

      - name: Fetch upstream
        run: git fetch upstream --tags

      - name: Check for updates
        id: check
        run: |
          # Count commits reachable from upstream/main but NOT from our HEAD.
          # The fork carries its own commits (render.yaml, this workflow), so a
          # plain SHA comparison would always report "new commits" even when
          # upstream has nothing new. rev-list answers the real question.
          BEHIND=$(git rev-list --count HEAD..upstream/main || echo 0)
          echo "local=$(git rev-parse --short HEAD)"
          echo "upstream=$(git rev-parse --short upstream/main)"
          echo "commits behind upstream: $BEHIND"
          if [ "$BEHIND" -eq 0 ]; then
            if [ "${{ github.event.inputs.force }}" = "true" ]; then
              echo "Up to date, but force=true — pushing an empty commit to trigger a Render rebuild."
              git commit --allow-empty -m "chore(sync): rerender [skip ci]" || true
              echo "needs_update=true" >> "$GITHUB_OUTPUT"
            else
              echo "Already up to date. Nothing to do."
              echo "needs_update=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "Upstream has $BEHIND new commit(s). Syncing."
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Merge upstream into main
        if: steps.check.outputs.needs_update == 'true'
        run: |
          set -e
          # Nothing to merge when we're already current (only reachable via the
          # force path, which already made its own empty commit above).
          BEHIND=$(git rev-list --count HEAD..upstream/main || echo 0)
          if [ "$BEHIND" -eq 0 ]; then
            echo "No upstream commits to merge; the force path already committed."
            exit 0
          fi
          # Merge upstream main. Use a merge commit so the fork keeps its own
          # history (render.yaml, this workflow) while pulling in upstream changes.
          git merge upstream/main --no-edit -m "chore(sync): merge upstream tashfeenahmed/freellmapi@$(git rev-parse --short upstream/main)"
          # Keep the fork's render.yaml on conflicts — it holds our deploy config.
          if git status --porcelain | grep -q '^UU render.yaml'; then
            git checkout --ours render.yaml
            git add render.yaml
            git commit --no-edit -m "chore(sync): keep fork render.yaml on conflict" || true
          fi

      - name: Record whether a merge happened
        id: merged
        if: steps.check.outputs.needs_update == 'true'
        run: |
          BEFORE="${{ github.sha }}"
          NOW=$(git rev-parse HEAD)
          if [ "$BEFORE" != "$NOW" ]; then
            echo "did_merge=true" >> "$GITHUB_OUTPUT"
          else
            echo "did_merge=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Push to fork
        if: steps.check.outputs.needs_update == 'true'
        run: git push origin main

      - name: Summary
        if: always()
        run: |
          echo "### Sync result" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.merged.outputs.did_merge }}" = "true" ]; then
            echo "✅ Fork updated and pushed. Render will auto-deploy shortly." >> "$GITHUB_STEP_SUMMARY"
            echo "New HEAD: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ℹ️ Already up to date with upstream. No changes pushed." >> "$GITHUB_STEP_SUMMARY"
          fi
